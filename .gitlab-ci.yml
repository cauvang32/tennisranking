include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: never
  
stages:
  - setup
  - security
  - test
  - build
  - deploy

variables:
  DEPLOY_PATH: /home/vps/tennisranking
  PERSISTENT_DATA_PATH: /home/vps/tennisranking-data
  PRODUCTION_ORIGIN: https://hungsanity.com
  PRODUCTION_DOMAIN: hungsanity.com
  GIT_ORIGIN: https://git.quocanh.tech/cauvang32/tennisranking
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"
  # Note: NODE_ENV=production is set only at deploy time, not globally
  # This ensures devDependencies (like vite) are installed during build
  SAST_STAGE: "security"

# =========================
# DEFAULT - DOCKER RUNNER
# =========================
default:
  image: node:22-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
  tags:
    - docker
  before_script:
    - set -e
  cache:
    key: npm-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .cache/npm/

# =========================
# SETUP
# =========================
setup-dependencies:
  stage: setup
  script:
    - echo "📦 Installing Node.js dependencies..."
    - node --version
    - npm --version
    - npm ci --prefer-offline --cache "$NPM_CACHE_DIR"
  cache:
    key: npm-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .cache/npm/
    policy: pull-push
  artifacts:
    paths:
      - package-lock.json
    expire_in: 1 hour

# NOTE:
# ----
# Các job security (SAST, secret_detection, dependency_scanning) được chèn tự động
# từ 3 template include ở trên. Bạn KHÔNG CẦN định nghĩa lại semgrep/eslint/npm-audit/snyk.
# Nếu muốn override một job template, định nghĩa job cùng tên sau include.

# =========================
# TEST & BUILD
# =========================
npm-audit:
  stage: security
  needs: [setup-dependencies]
  script:
    - echo "🔍 Running npm audit..."
    - npm audit --omit=dev --json --audit-level=high > npm-audit-report.json
  artifacts:
    paths:
      - npm-audit-report.json
    expire_in: 30 days
    when: always

eslint:
  stage: security
  needs: [setup-dependencies]
  script:
    - echo "📋 Running ESLint..."
    - npm run lint -- --format json --output-file eslint-report.json
  artifacts:
    paths:
      - eslint-report.json
    expire_in: 30 days
    when: always

# v0.69.3 is an immutable, known-safe Trivy release. Keep the multi-arch
# manifest digest pinned; do not replace it with a mutable latest tag.
trivy-fs:
  stage: security
  image:
    name: ghcr.io/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    entrypoint: [""]
  needs: [setup-dependencies]
  script:
    - trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --skip-version-check --format json --output trivy-report.json --exit-code 1 .
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 30 days
    when: always
  cache:
    key: trivy-db
    paths:
      - .cache/trivy/
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"

tests:
  stage: test
  needs: [setup-dependencies]
  script:
    - echo "🧪 Running tests..."
    - npm test

snyk:
  stage: security
  image: node:22-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
  needs: [setup-dependencies]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - npm install -g snyk@1.1301.0
  script: |
    echo "🔎 Snyk job starting..."
    echo "SNYK_TOKEN length: ${#SNYK_TOKEN}"

    # basic network tools for debugging inside the CI container
    apt-get update -y && apt-get install -y curl dnsutils || true
    echo "-> curl (ipv4):"; curl -4 -I -m 10 https://api.snyk.io || true
    echo "-> curl (ipv6):"; curl -6 -I -m 10 https://api.snyk.io || true
    nslookup api.snyk.io || true

    # if no token, skip safely and produce an artifact so upload won't fail
    if [ -z "$SNYK_TOKEN" ]; then
      echo "⚠️ SNYK_TOKEN not set — skipping snyk scan"
      echo '{}' > snyk-report.json
      exit 0
    fi

    # verbose logging for debug (remove when stable)
    #export SNYK_LOG_LEVEL=trace
    # prefer IPv4 (helps if IPv6 routing is flaky)
    export NODE_OPTIONS="--dns-result-order=ipv4first"

    # try snyk test with pruning + retries (prune reduces payload size)
    for i in 1 2 3; do
      echo "snyk attempt #$i ..."
      snyk test --prune-repeated-subdependencies -d --json > snyk-report.json && break || true
      echo "snyk attempt #$i failed, retrying in 5s..."
      sleep 5
    done

    # fallback: if test still failed, try monitor (sometimes smaller/safer) and keep a valid artifact
    if [ ! -s snyk-report.json ]; then
      echo "⚠️ snyk test failed repeatedly — attempting snyk monitor (prune) as fallback"
      snyk monitor --prune-repeated-subdependencies --json > snyk-monitor.json || true
      echo '{}' > snyk-report.json
    fi
  artifacts:
    paths:
      - snyk-report.json
      - snyk-monitor.json
    expire_in: 30 days
    when: always
  allow_failure: true

build:
  stage: build
  needs: [setup-dependencies]
  script:
    - echo "🔨 Building app..."
    - node --version
    - npm --version
    - npm ci --prefer-offline --cache "$NPM_CACHE_DIR" --include=dev
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
    when: on_success

# =========================
# 🚀 DEPLOY TO SERVER (giữ nguyên)
# =========================
deploy:
  stage: deploy
  tags:
    - ubuntu-latest-shell
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  needs:
    - job: build
  before_script:
    - set -e
    - echo "🚀 Starting deployment to production..."
  script:
    - install -d -m 750 "$PERSISTENT_DATA_PATH/uploads"
    # Copy media out of the Git checkout before reset. This migrates existing
    # deployments and makes every subsequent deployment independent of Git.
    - |
      if [ -d "$DEPLOY_PATH/data/uploads" ]; then
        cp -a "$DEPLOY_PATH/data/uploads/." "$PERSISTENT_DATA_PATH/uploads/"
      fi
    - cd "$DEPLOY_PATH"
    - git config --global --add safe.directory "$DEPLOY_PATH"
    - git remote set-url origin "$GIT_ORIGIN" || git remote add origin "$GIT_ORIGIN"
    - |
      previous_sha="$(git rev-parse HEAD 2>/dev/null || true)"
      if [ -n "$previous_sha" ] && [ -d dist ]; then
        install -d -m 750 "$PERSISTENT_DATA_PATH/releases/$previous_sha/dist"
        cp -a dist/. "$PERSISTENT_DATA_PATH/releases/$previous_sha/dist/"
      fi
    - git fetch origin
    - git reset --hard origin/$CI_DEFAULT_BRANCH
    - |
      touch .env
      chmod 600 .env
      set_env_value() {
        key="$1"
        value="$2"
        if grep -q "^${key}=" .env; then
          sed -i "s|^${key}=.*|${key}=${value}|" .env
        else
          printf '%s=%s\n' "$key" "$value" >> .env
        fi
      }
      set_env_value UPLOAD_ROOT "$PERSISTENT_DATA_PATH/uploads"
      set_env_value QUEUE_REDIS_URL "redis://127.0.0.1:6381/0"
      set_env_value RATE_LIMIT_REDIS_URL "redis://127.0.0.1:6381/1"
      set_env_value ALLOWED_ORIGINS "$PRODUCTION_ORIGIN"
      set_env_value PUBLIC_DOMAIN "$PRODUCTION_DOMAIN"
      set_env_value COOKIE_SECURE "true"
      set_env_value COOKIE_SAMESITE "strict"
      set_env_value ALLOW_DEV_ORIGINS "false"
      set_env_value TRUST_PROXY "true"
      set_env_value TRUST_PROXY_HOPS "1"

    # ── Stop PM2 app first ────────────────────────────────────────
    - pm2 stop tennis || true
    - docker compose up -d postgres redis redis-queue

    # ── Install runtime and migrate before starting new processes ──
    - npm ci --omit=dev
    - npm run migrate

    # ── Rebuild & restart Docker FCM worker ───────────────────────
    - docker compose build tennis-worker
    - docker compose up -d tennis-worker

    # ── Restart PM2 app ───────────────────────────────────────────
    - install -d -m 755 "$DEPLOY_PATH/dist"
    - cp -a "$CI_PROJECT_DIR/dist/." "$DEPLOY_PATH/dist/"
    - install -d -m 750 "$PERSISTENT_DATA_PATH/releases/$CI_COMMIT_SHA/dist"
    - cp -a "$CI_PROJECT_DIR/dist/." "$PERSISTENT_DATA_PATH/releases/$CI_COMMIT_SHA/dist/"
    - export UPLOAD_ROOT="$PERSISTENT_DATA_PATH/uploads"
    - export QUEUE_REDIS_URL="redis://127.0.0.1:6381/0"
    - export RATE_LIMIT_REDIS_URL="redis://127.0.0.1:6381/1"
    - pm2 delete tennis || true
    - bash scripts/start-with-redis.sh
  environment:
    name: production
    url: https://hungsanity.com/tennis
    on_stop: stop-production

stop-production:
  stage: deploy
  tags:
    - ubuntu-latest-shell
  rules:
    - when: manual
  script:
    - cd "$DEPLOY_PATH" || true
    - pm2 stop tennis || true
    - pm2 delete tennis || true
  environment:
    name: production
    action: stop

# =========================
# 🔄 ROLLBACK (Manual trigger)
# =========================
rollback:
  stage: deploy
  tags:
    - ubuntu-latest-shell
  rules:
    - when: manual
      allow_failure: true
  allow_failure:
    exit_codes:
      - 99
  
  script:
    - cd "$DEPLOY_PATH"
    - echo "⏪ Rolling back to previous commit..."
    - echo "🔧 Configuring git safe directory..."
    - git config --global --add safe.directory "$DEPLOY_PATH"
    - export ROLLBACK_SHA="$(git rev-parse HEAD~1)"
    - test -f "$PERSISTENT_DATA_PATH/releases/$ROLLBACK_SHA/dist/index.html"
    - git reset --hard "$ROLLBACK_SHA"

    # ── Stop PM2 app first ────────────────────────────────────────
    - pm2 stop tennis || true

    # ── Rebuild & restart Docker FCM worker ───────────────────────
    - npm ci --omit=dev
    - npm run migrate
    - export UPLOAD_ROOT="$PERSISTENT_DATA_PATH/uploads"
    - export QUEUE_REDIS_URL="redis://127.0.0.1:6381/0"
    - export RATE_LIMIT_REDIS_URL="redis://127.0.0.1:6381/1"

    # ── Restore the previously tested immutable frontend artifact ─
    - install -d -m 755 "$DEPLOY_PATH/dist"
    - cp -a "$PERSISTENT_DATA_PATH/releases/$ROLLBACK_SHA/dist/." "$DEPLOY_PATH/dist/"
    - docker compose build tennis-worker
    - docker compose up -d tennis-worker
    - pm2 delete tennis || true
    - bash scripts/start-with-redis.sh

    - echo "⚠️ Rollback completed - Pipeline marked as warning"
    - exit 99

  environment:
    name: production
