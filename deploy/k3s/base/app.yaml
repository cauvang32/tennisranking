apiVersion: apps/v1
kind: Deployment
metadata:
  name: tennis-app
  namespace: tennis-prod
  labels:
    app.kubernetes.io/name: tennis-app
    app.kubernetes.io/part-of: tennis-ranking
spec:
  replicas: 3
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tennis-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tennis-app
        app.kubernetes.io/part-of: tennis-ranking
    spec:
      serviceAccountName: tennis-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tennis-app
      containers:
        - name: app
          image: registry.example.invalid/tennis-ranking:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: tennis-config
            - secretRef:
                name: tennis-runtime
          env:
            - name: RUN_WORKERS
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: tennis-uploads
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tennis-app
  namespace: tennis-prod
  labels:
    app.kubernetes.io/name: tennis-app
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: tennis-app
  ports:
    - name: http
      port: 3001
      targetPort: http
      nodePort: 30001
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tennis-app
  namespace: tennis-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tennis-app
