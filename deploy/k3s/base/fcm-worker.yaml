apiVersion: apps/v1
kind: Deployment
metadata:
  name: tennis-fcm-worker
  namespace: tennis-prod
  labels:
    app.kubernetes.io/name: tennis-fcm-worker
    app.kubernetes.io/part-of: tennis-ranking
spec:
  replicas: 2
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tennis-fcm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tennis-fcm-worker
        app.kubernetes.io/part-of: tennis-ranking
    spec:
      serviceAccountName: tennis-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tennis-fcm-worker
      containers:
        - name: worker
          image: registry.example.invalid/tennis-ranking:replace-me
          imagePullPolicy: IfNotPresent
          command: ["node", "worker.js"]
          ports:
            - name: health
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: tennis-config
            - secretRef:
                name: tennis-runtime
          env:
            - name: PORT
              value: "3002"
            - name: RUN_WORKERS
              value: "true"
          startupProbe:
            httpGet:
              path: /health
              port: health
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: firebase
              mountPath: /var/run/secrets/firebase
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: firebase
          secret:
            secretName: tennis-firebase
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tennis-fcm-worker
  namespace: tennis-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tennis-fcm-worker
