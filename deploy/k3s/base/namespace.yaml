apiVersion: v1
kind: Namespace
metadata:
  name: tennis-prod
  labels:
    app.kubernetes.io/part-of: tennis-ranking
    # Third-party database operators do not yet render every restricted-PSS
    # field. Enforce baseline here; the app/worker explicitly use restricted
    # container security contexts below.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tennis-app
  namespace: tennis-prod
automountServiceAccountToken: false
