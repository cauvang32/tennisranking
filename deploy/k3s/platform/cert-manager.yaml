apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  version: v1.21.0
  targetNamespace: cert-manager
  createNamespace: true
  failurePolicy: abort
  valuesContent: |-
    crds:
      enabled: true
    prometheus:
      enabled: true
