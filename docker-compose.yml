services:

  # ── Background FCM Worker (Docker separation) ───────────────────────────────
  tennis-worker:
    build: .
    container_name: tennis-worker
    command: ["node", "worker.js"]
    restart: unless-stopped
    environment:
      - RUN_WORKERS=true
      - REDIS_URL=redis://tennis-redis:6379/0
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-tennis_ranking}
      - DB_USER=${DB_USER:-tennis_user}
      - DB_PASSWORD=${DB_PASSWORD:-tennis_password}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/etc/tennis-pro/firebase-service-account.json
      # Required config validations:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - EDITOR_USERNAME=${EDITOR_USERNAME:-editor}
      - EDITOR_PASSWORD=${EDITOR_PASSWORD:-editor}
      - JWT_SECRET=${JWT_SECRET:-secret}
      - CSRF_SECRET=${CSRF_SECRET:-secret}
    volumes:
      # Map the production firebase json file path to the container
      - /etc/tennis-pro/firebase-service-account.json:/etc/tennis-pro/firebase-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tennis-network

  # ── Node.js Application (PM2 cluster inside container) ───────────────────────

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tennis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-tennis_ranking}
      POSTGRES_USER: ${DB_USER:-tennis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tennis_password}
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
      - ./data/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tennis_user} -d ${DB_NAME:-tennis_ranking}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tennis-network

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tennis-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tennis-network

networks:
  tennis-network:
    driver: bridge

volumes:
  redis-data:
