services:

  # ── Background FCM Worker (Docker separation) ───────────────────────────────
  tennis-worker:
    build: .
    container_name: tennis-worker
    command: ["node", "worker.js"]
    restart: unless-stopped
    # Worker exposes a health endpoint on port 3002.
    # curl is installed in the image for reliable health probes.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    expose:
      - "3002"
    environment:
      - RUN_WORKERS=true
      - REDIS_URL=redis://tennis-redis:6379/0
      - QUEUE_REDIS_URL=redis://tennis-redis-queue:6379/0
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-tennis_ranking}
      - DB_USER=${DB_USER:-tennis_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/etc/tennis-pro/firebase-service-account.json
      # Required config validations:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - EDITOR_USERNAME=${EDITOR_USERNAME:-editor}
      - EDITOR_PASSWORD=${EDITOR_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
    volumes:
      # Map the production firebase json file path to the container
      - /etc/tennis-pro/firebase-service-account.json:/etc/tennis-pro/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks:
      - tennis-network
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: tennis-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-tennis_ranking}
      POSTGRES_USER: ${DB_USER:-tennis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
      - ./data/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tennis_user} -d ${DB_NAME:-tennis_ranking}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tennis-network

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: tennis-redis
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly no --save "" --maxmemory 512mb --maxmemory-policy allkeys-lfu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tennis-network

  # Persistent BullMQ storage is isolated from disposable cache/rate-limit data.
  redis-queue:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: tennis-redis-queue
    ports:
      - "127.0.0.1:6381:6379"
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tennis-network

networks:
  tennis-network:
    driver: bridge

volumes:
  redis-data:
  uploads-data:
