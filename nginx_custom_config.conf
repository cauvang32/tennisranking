# =========================================================
# 🛡️ TENNIS REVERSE PROXY CONFIG
# Per-server config for Nginx Proxy Manager or a single server block.
# No http{}-level maps are used here.
# NOTE: `proxy_cache HUNG_CDN;` requires the HUNG_CDN cache zone to be
# defined in the global `http {}` block somewhere else.
# =========================================================

# ---------------------------------------------------------
# PAGE SHELL
# Protect only the app shell with Anubis. Keep HTML uncached.
# ---------------------------------------------------------
location = /tennis {
    return 301 /tennis/;
}

location ^~ /tennis/ {
    auth_request /.within.website/x/cmd/anubis/api/check;
    error_page 401 403 =200 /.within.website/?redir=$request_uri;

    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache off;
    proxy_buffering on;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ---------------------------------------------------------
# STATIC ASSETS
# Cache aggressively.
# ---------------------------------------------------------
location ^~ /tennis/assets/ {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache HUNG_CDN;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 301 1h;
    proxy_cache_valid 404 1m;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_revalidate on;

    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

location ~* ^/tennis/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache HUNG_CDN;
    proxy_cache_valid 200 7d;
    proxy_cache_background_update on;
    proxy_cache_lock on;

    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

# ---------------------------------------------------------
# PUBLIC API CACHE
# Cache only anonymous GET reads.
# ---------------------------------------------------------
location ^~ /tennis/api/rankings/ {
    proxy_pass http://localhost:3001/api/rankings/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache HUNG_CDN;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 30s;
    proxy_cache_valid 301 1m;
    proxy_cache_valid 404 10s;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=30" always;
}

