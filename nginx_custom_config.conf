# =========================================================
# 🛡️ TENNIS REVERSE PROXY CONFIG
# Per-server config for Nginx Proxy Manager or a single server block.
# No http{}-level maps are used here.
# NOTE: `proxy_cache HUNG_CDN;` requires the HUNG_CDN cache zone to be
# defined in the global `http {}` block somewhere else.
#
# SECURITY (S-2): X-Forwarded-For is OVERWRITTEN with $remote_addr (not
# appended) because this nginx is the edge proxy. Appending
# ($proxy_add_x_forwarded_for) would let clients inject their own IPs into
# the chain, and the app trusts one proxy hop — enabling per-IP rate-limit
# and device-cap bypass. Overwriting makes the client IP unspoofable.
# Do not re-enable $proxy_add_x_forwarded_for unless an upstream trusted
# proxy already sets a canonical XFF in front of this one.
# =========================================================

# ---------------------------------------------------------
# PAGE SHELL
# Protect only the app shell with Anubis. Keep HTML uncached.
# ---------------------------------------------------------

# ---------------------------------------------------------
# EDGE RATE LIMITING — per-location usage (server context)
#
# The `tennis_api` / `tennis_login` zones referenced by the `limit_req`
# directives in this file are DEFINED in `nginx_http_rate_limit.conf`, which
# must be added to the GLOBAL http{} custom configuration (see that file).
# ---------------------------------------------------------

# Strict brute-force guard for the login path (exact match wins over the
# `^~ /tennis/api/auth` prefix location). Complements the app's loginLimiter
# (10 req / 5 min, fail-closed).
location = /tennis/api/auth/login {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    limit_req zone=tennis_login burst=2 nodelay;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
}

location = /tennis {
    return 301 /tennis/;
}

location ^~ /tennis/ {
    auth_request /.within.website/x/cmd/anubis/api/check;
    error_page 401 403 =200 /.within.website/?redir=$request_uri;

    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    limit_req zone=tennis_api burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache off;
    proxy_buffering on;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ---------------------------------------------------------
# STATIC ASSETS
# Cache aggressively.
# ---------------------------------------------------------
location ^~ /tennis/assets/ {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    limit_req zone=tennis_api burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache HUNG_CDN;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 301 1h;
    proxy_cache_valid 404 1m;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_revalidate on;

    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

location ~* ^/tennis/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    limit_req zone=tennis_api burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache HUNG_CDN;
    proxy_cache_valid 200 7d;
    proxy_cache_background_update on;
    proxy_cache_lock on;

    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

# ---------------------------------------------------------
# PUBLIC API CACHE
# Cache only anonymous GET reads.
# SECURITY (S4): Added proxy_no_cache to prevent cache poisoning —
# authenticated responses must never be cached and served to anonymous users.
# The cache key does NOT include cookies, so an admin's response could be
# cached and served to anyone. proxy_no_cache fixes this.
# ---------------------------------------------------------
location ^~ /tennis/api/rankings/ {
    proxy_pass http://localhost:3001/api/rankings/;
    proxy_ignore_headers Cache-Control Expires;
    proxy_http_version 1.1;
    limit_req zone=tennis_api burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache HUNG_CDN;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    # SECURITY (S4): Bypass cache when cookies are present (authenticated request)
    proxy_no_cache $http_cookie;
    proxy_cache_bypass $http_cookie;
    proxy_cache_valid 200 30s;
    proxy_cache_valid 301 1m;
    proxy_cache_valid 404 10s;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=30" always;
}

