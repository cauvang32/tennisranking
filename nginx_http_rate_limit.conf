# =========================================================
# 🛡️ EDGE RATE LIMITING — zone definitions (HTTP context)
#
# ⚠️  These directives MUST live in the global `http {}` block, NOT in a
#     `server {}` block. In Nginx Proxy Manager, paste this file's contents
#     into the GLOBAL custom configuration:
#       Dashboard → (top bar) ⚙️ / "Custom configuration" (the global one,
#       which is injected into the http{} block).
#
# The per-location `limit_req` usage that references these zones lives in
# `nginx_custom_config.conf` (the per-host server block).
#
# WHY THIS EXISTS:
#   A response served from the HUNG_CDN proxy_cache never reaches the Express
#   app, so the app's per-IP Redis rate limiters (middleware/rate-limiter.ts)
#   never see it. limit_req runs in nginx's access phase — BEFORE the cache is
#   consulted — so per-IP limiting is enforced on EVERY request, cache HIT or
#   MISS. The CDN still absorbs repeated reads (its DDoS-shield value is kept);
#   the edge limiter additionally caps the per-IP request rate and blocks
#   floods before they even reach the cache.
#
# KEYED ON $remote_addr:
#   With no external CDN in front of this edge, $remote_addr is the real
#   client IP. If you later put Cloudflare (or any CDN) in front, define a
#     map $http_cf_connecting_ip $cf_connecting_ip;
#   and key the zones on $cf_connecting_ip instead — otherwise every visitor
#   shares one Cloudflare IP and gets rate-limited together.
#
# Values are coarse spike/abuse guards (defence-in-depth). The app's
# Redis-backed limiters remain the precise, persistent second line for every
# route that actually reaches Express.
# =========================================================

# General per-IP request-rate guard (applied to every location in the
# per-host config). 20 req/s sustained, 40-request burst allowance — well above
# a normal page load, well below a flood.
limit_req_zone $remote_addr zone=tennis_api:10m rate=20r/s;

# Strict brute-force guard for the login path only. 6 req/min = 1 per 10s.
limit_req_zone $remote_addr zone=tennis_login:10m rate=6r/m;

# Return 429 (not the default 503) when a limit is exceeded, to match the
# app's own rate-limit responses.
limit_req_status 429;
